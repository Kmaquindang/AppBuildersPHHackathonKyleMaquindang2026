name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  android:
    name: Kotlin tests (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Use the runner's Android SDK
        run: rm -f android/local.properties
      - name: Unit tests
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest

  swift:
    name: Swift core tests (macOS, no signing)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run the core test runner
        run: swift build --product PasaCoreTests && ./.build/debug/PasaCoreTests
      - name: Compile the Mac app without signing
        run: xcodebuild -project Libre.xcodeproj -scheme Libre-macOS -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO build
